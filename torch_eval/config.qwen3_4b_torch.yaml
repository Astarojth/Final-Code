model:
  model_dir: Qwen/Qwen3-4B-Thinking-2507
  tokenizer_dir: Qwen/Qwen3-4B-Thinking-2507
  download_dir: /path/to/model_cache/huggingface
  cache_dir: /path/to/model_cache/huggingface
  hf_home: /path/to/model_cache/huggingface_home
  trust_remote_code: true
  dtype: bfloat16
  max_model_len: 32768
  disable_log_stats: true
  max_logprobs: 50
  reasoning_start_str: "<think>"
  reasoning_end_str: "</think>\nFINAL_ANSWER: "

supervision_dir: /path/to/stage_a
controller_artifact: /path/to/autocrat_controller.pt
dataset_root: /path/to/divided_benchmarks
output_dir: ../runs/torch_eval

prompt_template: |
  You are solving a benchmark reasoning problem.

  {prompt}

  Output requirements:
  - Keep reasoning concise.
  - After </think>, immediately output FINAL_ANSWER: followed by the final answer.
  - For non-code tasks, FINAL_ANSWER: must be a single short final-answer line.
  - For code tasks, put the final code solution directly after FINAL_ANSWER: with no explanation.

datasets:
  - dataset: gsm8k
    loader: gsm8k
    split: test
    source: gsm8k/test.jsonl
    per_dataset_offset: 0
    per_dataset_limit: null
  - dataset: arc_challenge
    loader: arc_challenge
    split: test
    source: arc_challenge/test.jsonl
    per_dataset_offset: 0
    per_dataset_limit: null
  - dataset: mbpp
    loader: mbpp
    split: test
    source: mbpp/test.jsonl
    per_dataset_offset: 0
    per_dataset_limit: null
  - dataset: math_500
    loader: math_500
    split: test
    source: math_500/test.jsonl
    per_dataset_offset: 0
    per_dataset_limit: null
  - dataset: gpqa_diamond
    loader: gpqa_diamond
    split: test
    source: gpqa_diamond/test.jsonl
    per_dataset_offset: 0
    per_dataset_limit: null
  - dataset: humaneval
    loader: humaneval
    split: test
    source: humaneval/test.jsonl
    per_dataset_offset: 0
    per_dataset_limit: null

sampling_levels:
  1: {temperature: 0.0, top_p: 0.95, top_k: -1, min_p: 0.0}
  2: {temperature: 0.3, top_p: 0.95, top_k: -1, min_p: 0.0}
  3: {temperature: 0.7, top_p: 0.95, top_k: -1, min_p: 0.0}
  4: {temperature: 1.0, top_p: 0.95, top_k: -1, min_p: 0.0}

budget_levels:
  0: 0
  1: 64
  2: 256
  3: 1024
  4: 4096

runtime:
  max_items_per_dataset: null
  static_batch_size: 16
  progress_log_every: 5
  code_exec_timeout_sec: 4.0
  code_exec_python_bin: python3

policy_runtime:
  start_action_strategy: global_best_static
  prior_weight: 0.0
  boundary_weight: 1.0
  switch_cost: 0.0
  hysteresis_bonus: 0.0
  budget_guardrail_penalty: 0.0
  max_switches: 8
  progress_backtrack_tolerance: 0.03
  logprobs_k: 50
  think_chunk_tokens: 48
  answer_chunk_tokens: 96
  static_answer_completion_budget: 16384
  torch_max_total_tokens: 16384
  boundary_min_tokens: 6
  boundary_min_chars: 24
  max_segments: 80
  early_completion_check: false

baselines:
  - segmented_global_best_no_switch
  - segmented_category_best_no_switch
  - dynamic_global_best_start
  - dynamic_category_best_start
